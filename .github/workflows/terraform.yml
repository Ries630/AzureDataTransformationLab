name: Terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan-report-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Install pinned tfplan2md
        run: node scripts/terraform/install-tfplan2md.mjs "$RUNNER_TEMP/tfplan2md"
      - name: Verify report publication boundary
        env:
          TFPLAN2MD_PATH: ${{ runner.temp }}/tfplan2md/tfplan2md
        run: node --test scripts/terraform/*.test.mjs

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/terraform, infra/state-backend]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      # Azure認証を使わず、外部APIをモックしたplanだけを実行する。
      - run: terraform test -no-color
