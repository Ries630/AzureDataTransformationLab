name: AWS pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lambda-package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.7'
      - name: Verify Linux arm64 Lambda package imports
        run: uv run scripts/aws/package.py "$RUNNER_TEMP/aws-lambda.zip"
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.7'
      - run: uvx --from ruff==0.15.2 ruff check functions/aws tests/aws/test_pipeline.py scripts/aws/package.py scripts/aws/test_pipeline.py
      - run: uvx --from ruff==0.15.2 ruff format --check functions/aws tests/aws/test_pipeline.py scripts/aws/package.py scripts/aws/test_pipeline.py
      - run: uvx --from ruff==0.15.2 ruff check --target-version py311 glue tests/aws/test_transform.py scripts/aws/test_spark.py
      - run: uvx --from ruff==0.15.2 ruff format --check --target-version py311 glue tests/aws/test_transform.py scripts/aws/test_spark.py
      - name: Verify AWS processing contracts with SDK mocks
        run: uv run --locked scripts/aws/test_pipeline.py
      - name: Verify the shared CSV validation contract
        run: uv run scripts/validator/test_pure.py
  spark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.7'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify transformations with Spark 3.5.6 and Python 3.11
        run: uv run --locked scripts/aws/test_spark.py
