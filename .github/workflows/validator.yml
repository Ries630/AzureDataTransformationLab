name: CSV validator

on:
  pull_request:
    paths:
      - 'functions/validator/**'
      - 'tests/validator/**'
      - 'scripts/validator/**'
      - 'samples/**'
      - 'ruff.toml'
      - '.github/workflows/validator.yml'
      - '.github/actions/setup-python-tools/**'
  push:
    branches: [main]
    paths:
      - 'functions/validator/**'
      - 'tests/validator/**'
      - 'scripts/validator/**'
      - 'samples/**'
      - 'ruff.toml'
      - '.github/workflows/validator.yml'
      - '.github/actions/setup-python-tools/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tools
      - run: uv run --locked functions/validator/function_app.py test
      - run: uv run scripts/validator/test_pure.py
      - run: uvx --from "ruff==$RUFF_VERSION" ruff check functions/validator tests/validator scripts/validator
      - run: uvx --from "ruff==$RUFF_VERSION" ruff format --check functions/validator tests/validator scripts/validator
      - name: Build Linux deployment directory
        run: uv run scripts/validator/package.py "$RUNNER_TEMP/validator-package"
