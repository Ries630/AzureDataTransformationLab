name: CSV validator

on:
  pull_request:
    paths:
      - 'functions/validator/**'
      - 'tests/validator/**'
      - 'scripts/validator/**'
      - 'samples/**'
      - '.github/workflows/validator.yml'
      - '.github/actions/setup-python-tools/**'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches: [main]
    paths:
      - 'functions/validator/**'
      - 'tests/validator/**'
      - 'scripts/validator/**'
      - 'samples/**'
      - '.github/workflows/validator.yml'
      - '.github/actions/setup-python-tools/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-tools
      - run: uv run --locked --package validator functions/validator/function_app.py test
      - run: uv run scripts/validator/test_pure.py
      - name: Type check with the locked dependencies
        run: |
          uv run --locked --package validator --group dev ty check \
            --extra-search-path functions/validator \
            functions/validator tests/validator scripts/validator
      - name: Build Linux deployment directory
        run: uv run scripts/validator/package.py "$RUNNER_TEMP/validator-package"
